defaults:
  - launcher: local
  - solver: cem
  - objective: goal_mse
  - _self_

world:
  env_name: swm/ReacherDMControl-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # make sure it's >= eval_budget
  task: qpos_match

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action

seed: 42
policy: random # ckpt name or random

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

# evaluation from dataset (replay expert trajectories)
eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  video: true
  # Optional fixed CLEAR-LeWM v0.5 manifest. When set, its pair list and
  # selected success criterion replace random row sampling.
  manifest: null
  # Permit a non-CEM solver on fixed CLEAR pairs. Such a run is an ablation,
  # not a protocol-conformant CLEAR result, and is marked as such in JSON.
  solver_ablation: false
  img_size: 224
  dataset_name: dmc/reacher_random.h5
  callables:
    # -- set state
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel

    - method: set_target_qpos
      args:
        target_qpos:
          value: goal_qpos

compile: false
bf16: false

output:
  dir: null
  filename: dmc_results.txt
