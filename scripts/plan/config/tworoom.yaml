defaults:
  - launcher: local
  - solver: cem
  - objective: goal_mse
  - _self_

world:
  env_name: swm/TwoRoom-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # make sure it's >= eval_budget

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio

seed: 42
policy: random # ckpt name or random

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

# evaluation from dataset (replay expert trajectories)
eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  video: true
  # Optional fixed CLEAR-LeWM v0.5 manifest. When set, its pair list and
  # selected success criterion replace random row sampling.
  manifest: null
  # Locked selected_threshold.json for endpoint self-evaluation. Requires a
  # CLEAR manifest and the exact checkpoint recorded by the threshold.
  find_goal_threshold: null
  # Permit a non-CEM solver on fixed CLEAR pairs. Such a run is an ablation,
  # not a protocol-conformant CLEAR result, and is marked as such in JSON.
  solver_ablation: false
  img_size: 224
  dataset_name: tworoom.h5
  callables:
    # -- set state
    - method: _set_state
      args:
        state:
          value: pos_agent
    # -- set goal state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_pos_agent

compile: false
bf16: false

output:
  dir: null
  filename: tworoom_results.txt
